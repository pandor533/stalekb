[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pandor533-stalekb"
version = "0.1.0"
description = "把候选项映射到类别上，算出知识库的过期率的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pandor533" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://pandor533.github.io"
Repository = "https://github.com/pandor533/stalekb"
Issues = "https://github.com/pandor533/stalekb/issues"

[project.scripts]
stalekb = "stalekb:main"

[tool.setuptools]
py-modules = ["stalekb"]
